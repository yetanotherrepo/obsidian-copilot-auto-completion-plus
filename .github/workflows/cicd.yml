name: cicd

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

env:
    PLUGIN_NAME: copilot-auto-completion-plus
    PRE_COMMIT_VERSION: 4.6.1

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
            - name: Use Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24.x
                  cache: npm

            - name: Build
              id: build
              run: |
                  npm ci
                  npm run build

            - name: Lint
              run: npm run lint

            - name: Pre-commit checks
              run: |
                  python -m pip install "pre-commit==$PRE_COMMIT_VERSION"
                  pre-commit run --all-files

            - name: Test
              id: test
              run: |
                  npm run tests

            - name: Docs and release checks
              run: npm run docs:check

            - name: Dependency audit
              run: npm audit --audit-level=high

            - name: Check changelog
              run: |
                  VERSION=$(jq -r '.version' package.json)
                  CHANGELOG=$(sed -n -e "/## $VERSION/,/## /p" CHANGELOG.md | sed "/## /d")
                  if [ -z "$CHANGELOG" ]; then
                    echo "Error: No release notes found for this version ($VERSION) in CHANGELOG.md"
                    exit 1
                  fi
