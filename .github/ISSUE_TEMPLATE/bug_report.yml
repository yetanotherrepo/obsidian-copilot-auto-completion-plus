name: Bug report
description: Report a problem with Copilot Auto Completion Plus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you were doing and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the safe diagnostics from the plugin issue reporter. Do not include note text or secrets.
      placeholder: |
        Plugin version:
        Provider:
        Model:
        API URL:
        Error:
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste API keys, access tokens, or private note contents.
          required: true
