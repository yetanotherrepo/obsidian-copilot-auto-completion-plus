name: Provider or model issue
description: Report a provider-specific or model-specific failure
title: "[Provider/model]: "
labels: ["provider", "model"]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI
        - Anthropic
        - Gemini
        - Azure OpenAI
        - Ollama
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: gpt-5.5
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and safe diagnostics
      description: Paste the safe diagnostics from Settings > Support or the Report issue button.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any non-sensitive details that help reproduce the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste API keys, access tokens, or private note contents.
          required: true
